<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
    <style>
        table { border-collapse: collapse; width: 70%; margin: 20px auto; }
        th, td { border: 1px solid #555; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .actions a { margin: 0 5px; padding: 4px 8px; border-radius: 4px; text-decoration: none; }
        .edit { background-color: #ffd966; }
        .delete { background-color: #ff6666; color: white; }
        .add { background-color: #28a745; color: white; text-decoration: none; padding: 8px 12px; }
        .home { display: inline-block; margin: 20px; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Student List</h2>
    <div style="text-align:center;">
        <a href="students/add" class="add">➕ Add Student</a>
        <a href="/" class="home">🏠 Back to Home</a>
    </div>
    <table>
            <tr>
                <th>ID</th><th>Name</th><th>Email</th><th>Actions</th>
            </tr>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.email}"></td>
                <td class="actions">
                    <a th:href="@{/students/edit/{id}(id=${s.id})}" class="edit">✏ Edit</a>
                    <a th:href="@{/students/delete/{id}(id=${s.id})}" class="delete"
                       onclick="return confirm('Are you sure you want to delete this student?');">🗑 Delete</a>
                </td>
            </tr>
    </table>
</body>
</html>
